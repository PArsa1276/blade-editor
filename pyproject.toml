[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blade-editor"
version = "0.1.0b1"
description = "Free, local video-editing MCP server: beat-synced edits, effects, Persian text, captions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2,<3", "numpy>=1.24", "pillow>=10", "websockets>=14"]

[project.optional-dependencies]
captions = ["faster-whisper>=1.1"]
# NVIDIA GPU for captions: CUDA 12 cuBLAS + cuDNN 9 for CTranslate2 (no separate CUDA install).
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
subject = ["onnxruntime>=1.17"]
flow = ["playwright>=1.40"]
test = ["pytest>=8"]

[project.scripts]
blade-editor = "blade_editor.server:main"

[tool.setuptools]
packages = ["blade_editor"]

[tool.setuptools.package-data]
blade_editor = ["fonts/*.ttf", "GUIDE.md", "PLAYBOOK.md", "extension_id.txt", "motion_templates/*/*.tsx"]
